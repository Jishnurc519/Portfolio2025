<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" fill="none" stroke="#6fd9c8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" font-family="Clash Display, sans-serif" font-weight="400" font-size="13">
  <!-- From the notebook's "Process" page: the screen on its legs with tokens on it, and the steps beside it. -->
  <title>Training the model: tokens photographed on the lit screen, classified, a model trained, then shader and model run together in Python</title>

  <!-- the screen on its stand, tokens on it -->
  <rect x="20" y="40" width="210" height="130" rx="4"/>
  <path d="M20 160 H230" opacity="0.6"/>
  <path d="M40 170 V232 M58 170 V232 M192 170 V232 M210 170 V232"/>
  <g>
    <circle cx="70" cy="80" r="12"/><path d="M64 80 H76"/>
    <circle cx="170" cy="78" r="12"/><path d="M164 78 H176"/>
    <circle cx="92" cy="128" r="12"/><path d="M86 128 H98 M92 122 V134"/>
    <circle cx="160" cy="126" r="12"/><path d="M154 126 H166"/>
  </g>
  <!-- detection boxes, as the model draws them -->
  <g stroke-dasharray="3 4" opacity="0.55">
    <rect x="52" y="62" width="36" height="36"/>
    <rect x="152" y="60" width="36" height="36"/>
    <rect x="74" y="110" width="36" height="36"/>
    <rect x="142" y="108" width="36" height="36"/>
  </g>

  <!-- the pipeline -->
  <g>
    <rect x="272" y="44" width="128" height="50" rx="6"/>
    <rect x="428" y="44" width="128" height="50" rx="6"/>
    <rect x="584" y="44" width="150" height="50" rx="6"/>
    <rect x="428" y="150" width="306" height="56" rx="6"/>
    <path d="M232 69 H266 M260 64 L266 69 L260 74"/>
    <path d="M400 69 H422 M416 64 L422 69 L416 74"/>
    <path d="M556 69 H578 M572 64 L578 69 L572 74"/>
    <path d="M659 94 V144 M654 138 L659 144 L664 138"/>
  </g>
  <g stroke="none" fill="#6fd9c8">
    <text x="284" y="66">photograph the</text><text x="284" y="83">tokens on screen</text>
    <text x="440" y="66">classify</text><text x="440" y="83">each token</text>
    <text x="596" y="66">train the</text><text x="596" y="83">recognition model</text>
    <text x="442" y="174">run the field shader and the model</text><text x="442" y="192">together, in one Python loop</text>
    <text x="272" y="120" opacity="0.7">keep the screen on while training —</text>
    <text x="272" y="138" opacity="0.7">the projected lines mess things up</text>
  </g>
</svg>
