<!-- Fetched and drawn exactly like the three brand marks beside it: solid
     #ffffff, because index.html paints these into the canvas in difference,
     where a fully-lit source inverts the ground under it and so comes out as
     the light tone over dark and the dark tone over light. An explicit
     width/height is what gives the <img> an intrinsic size for drawImage. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img">
  <path fill="#ffffff" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5Z"/>
</svg>
