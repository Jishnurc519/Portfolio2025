<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Instanced PBR Cubes — Negate Blend (Mouse + Touch) + Reliable Mobile Font</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ✅ Use Fontshare (official) for Clash Display — more reliable on mobile than Google Fonts -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/css?f[]=clash-display@400,700&display=swap" rel="stylesheet">

  <style>
    :root { --bg: #000; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    /* Force Clash Display with good mobile rendering hints */
    body {
      font-family: 'Clash Display', system-ui, -apple-system, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: var(--bg);
      font-synthesis-weight: none; /* don't fake bold */
    }
    #root { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
    #stage { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; } /* prevent scroll/zoom while drawing */

    /* Overlay text with NEGATE blending */
    #title {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      line-height: 1.2;
      pointer-events: none;
      user-select: none;
      text-align: center;
      font-size: clamp(28px, 6vw, 72px);
      color: white;
      white-space: nowrap;
      z-index: 10;
      mix-blend-mode: difference; /* Negate effect with 3D canvas behind */
      letter-spacing: 0.02em;
    }
    /* Explicit weights so mobile picks correct files */
    #title .bold { font-weight: 700; }
    #title .normal { font-weight: 400; }
    #title .line { display: block; }
  </style>

  <!-- Import maps polyfill (works on file:// and older browsers) -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js",
      "three/examples/jsm/environments/RoomEnvironment.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js",
      "simplex-noise": "https://esm.sh/simplex-noise@4.0.1"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div id="stage"></div>
    <div id="title" aria-hidden="true">
      <span class="line">
        <span class="bold">jishnu</span><span class="normal">has</span>
      </span>
      <span class="line">
        <span class="normal">an</span><span class="bold">artpage</span>
      </span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
    import { createNoise3D } from 'simplex-noise';

    // ---------- Setup ----------
    const rootEl  = document.getElementById('root');
    const stageEl = document.getElementById('stage');

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Cap DPR for mobile performance
    const DPR_CAP = /Mobi|Android/i.test(navigator.userAgent) ? 1.2 : 1.5;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
    renderer.outputColorSpace     = THREE.SRGBColorSpace;
    renderer.toneMapping          = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure  = 1.1;
    stageEl.appendChild(renderer.domElement);

    // Lock camera (no user rotation/zoom/pan)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;

    // ---------- Environment / PBR (local, no network HDRI) ----------
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new RoomEnvironment(renderer);
    const envRT = pmrem.fromScene(envScene).texture;
    scene.environment = envRT;

    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 0.35,
      roughness: 0.35,
      envMap: envRT,
      envMapIntensity: 1.1
    });

    // ---------- Instanced cubes ----------
    const MAX_INSTANCES = 2000;
    const TRIGGER_COUNT = 200;  // grow+invert when we reach this many
    const baseSize      = 0.35;
    const geo  = new THREE.BoxGeometry(baseSize, baseSize, baseSize);
    const mesh = new THREE.InstancedMesh(geo, material, MAX_INSTANCES);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.count = 0; // render none initially
    scene.add(mesh);

    let count = 0;
    const dummy = new THREE.Object3D();
    const pos         = new Float32Array(MAX_INSTANCES * 3);
    const scaleBase   = new Float32Array(MAX_INSTANCES);
    const scaleTarget = new Float32Array(MAX_INSTANCES);

    // ---------- State machine ----------
    let drawing     = false;
    let triggered   = false;
    let triggerTime = 0;
    let invertCycle = false;

    // 3D noise
    const noise3D = createNoise3D();
    const j3 = (x, y, z) => noise3D(x, y, z);

    // ---------- Spawn plane ----------
    const raycaster = new THREE.Raycaster();
    const pointer   = new THREE.Vector2();
    function makePlane() {
      // Plane ~6 units in front of the camera, facing camera
      return new THREE.Plane(new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion), -6);
    }
    let plane = makePlane();

    function worldPointFromClientXY(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const pt = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, pt);
      return pt;
    }

    function spawnAtClientXY(clientX, clientY) {
      if (triggered || count >= MAX_INSTANCES) return;
      const pt = worldPointFromClientXY(clientX, clientY);
      pt.x += (Math.random() - 0.5) * 0.2;
      pt.y += (Math.random() - 0.5) * 0.2;

      const i = count++;
      pos[i*3 + 0] = pt.x;
      pos[i*3 + 1] = pt.y;
      pos[i*3 + 2] = pt.z;
      scaleBase[i]   = 1.0;
      scaleTarget[i] = 10.0; // placeholder; computed on trigger

      dummy.position.set(pt.x, pt.y, pt.z);
      dummy.scale.setScalar(scaleBase[i]);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);

      mesh.count = count; // draw exactly 'count'
      mesh.instanceMatrix.needsUpdate = true;
    }

    function computeTargetsToCover() {
      for (let i = 0; i < count; i++) {
        const cx = pos[i*3 + 0], cy = pos[i*3 + 1], cz = pos[i*3 + 2];
        const v  = new THREE.Vector3(cx, cy, cz).project(camera);
        const ndcX = Math.abs(v.x), ndcY = Math.abs(v.y);
        const dist = new THREE.Vector3(cx, cy, cz).distanceTo(camera.position);

        const coverFactor  = 0.9 / Math.max(0.1, 1 - Math.max(ndcX, ndcY));
        const baseToScreen = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
        const scaleNeeded  = Math.max(20, coverFactor * baseToScreen * 2.2); // make sure it fills
        scaleTarget[i] = scaleNeeded;
      }
    }

    // ---------- Input (POINTER EVENTS: mouse + touch + pen) ----------
    const passiveFalse = { passive: false };

    renderer.domElement.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary) return;
      if (ev.pointerType === 'mouse' && ev.button !== 0) return; // left button only
      drawing = true;
      ev.preventDefault();
      spawnAtClientXY(ev.clientX, ev.clientY);
    }, passiveFalse);

    renderer.domElement.addEventListener('pointermove', (ev) => {
      if (!ev.isPrimary || !drawing) return;
      ev.preventDefault();
      spawnAtClientXY(ev.clientX, ev.clientY);
    }, passiveFalse);

    const endDrawing = (ev) => { if (ev.isPrimary) drawing = false; };
    renderer.domElement.addEventListener('pointerup', endDrawing, passiveFalse);
    renderer.domElement.addEventListener('pointercancel', endDrawing, passiveFalse);
    renderer.domElement.addEventListener('pointerleave', endDrawing, passiveFalse);

    // ---------- Resize / orientation ----------
    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      plane = makePlane();
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 50));

    // ---------- Clear all cubes ----------
    function clearAllCubes() {
      count = 0;
      mesh.count = 0;
      mesh.instanceMatrix.needsUpdate = true;
      pos.fill(0);
      scaleBase.fill(0);
      scaleTarget.fill(0);
    }

    // ---------- Animation ----------
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const t   = now * 0.001;

      if (!triggered && count >= TRIGGER_COUNT) {
        computeTargetsToCover();
        triggered   = true;
        triggerTime = now;
      }

      const growth = triggered ? Math.min(1, (now - triggerTime) / 1000) : 0;
      const ease = (p) => (p < 0.5 ? 2*p*p : -1 + (4 - 2*p)*p);

      for (let i = 0; i < count; i++) {
        let x = pos[i*3 + 0];
        let y = pos[i*3 + 1];
        let z = pos[i*3 + 2];

        if (!triggered) {
          const n1 = j3(x * 0.35, y * 0.35, t * 0.6);
          const n2 = j3(y * 0.35 + 10, x * 0.35 - 7, t * 0.6 + 5);
          x += n1 * 0.03;
          y += n2 * 0.03;
          pos[i*3 + 0] = x;
          pos[i*3 + 1] = y;
        }

        const s = triggered ? (scaleBase[i] + (scaleTarget[i] - scaleBase[i]) * ease(growth))
                            : scaleBase[i];

        dummy.position.set(x, y, z);
        dummy.scale.setScalar(s);
        // subtle rotation for a bit of life
        dummy.rotation.set(0.15 * Math.sin(t + i), 0.2 * Math.cos(t*0.9 + i*0.37), 0);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.count = count;
      mesh.instanceMatrix.needsUpdate = count > 0;

      if (triggered && growth >= 1) {
        invertCycle = !invertCycle;
        rootEl.style.filter = invertCycle ? 'invert(1)' : 'invert(0)';
        triggered = false;
        clearAllCubes();
      }

      renderer.render(scene, camera);
    }
    animate();

    // Optional: log which font actually got applied (mobile debugging)
    document.fonts?.ready?.then(() => {
      const fam = getComputedStyle(document.getElementById('title')).fontFamily;
      console.log('Using font family:', fam);
    });
  </script>
</body>
</html>
