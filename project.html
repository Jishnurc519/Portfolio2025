<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jishnu Roy Chaudhury — Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      /* The site pair, exact complements: see assets/page.css. */
      background: #0b0e13; color: #f4f1ec;
      font-family: 'Clash Display', sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    p { font-size: 18px; font-weight: 300; opacity: 0.7; }
    a { color: #6fd9c8; }
  </style>
</head>
<body>
  <!-- Every project now has its own page under projects/ (see
       scripts/build_project_pages.py). This file only survives so that old
       project.html?p=category/slug links still land somewhere sensible. -->
  <p id="message">Taking you to the project…</p>
  <script>
    const key = new URLSearchParams(location.search).get('p');
    const slug = key && key.includes('/') ? key.split('/')[1] : key;
    if (slug && /^[a-z0-9]+$/.test(slug)) {
      location.replace(`projects/${slug}.html`);
    } else {
      document.getElementById('message').innerHTML =
        'That project link is out of date. <a href="index.html">Head home</a>.';
    }
  </script>
  <noscript><p>This link has moved. <a href="index.html">Head home</a>.</p></noscript>
</body>
</html>
