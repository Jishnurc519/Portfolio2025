  <style>
    /* THE PAIR, restated for this section. The three sections take the three
       subtractive primaries -- work cyan, play magenta, facilitation yellow --
       so the site reads as one CMY set rather than three unrelated tints.
       Work runs on cyan and the site's near-black rather than on paper and
       near-black, so the value that difference blending swaps them with is
       dark + cyan, not the site-wide #ffffff. Every mark on the page that
       paints itself by difference resolves its ink from --tone-swap -- the
       cursor ring and its charge meter, the section counter, the chevrons,
       the back link -- and so does the bar layer below, which reads the
       variable rather than carrying its own copy of it. The two have to move
       together: with the site-wide operand the bars come out a flat orange
       over the cyan, because |a3e9e6 - ffffff| is rgb(92, 22, 25).
       11+163, 14+233, 19+230 -- exact complements, which is what makes the
       swap land on the other tone to the byte instead of near it. */
    :root {
      --tone-light: #a3e9e6;
      --tone-light-rgb: 163, 233, 230;
      --tone-swap: #aef7f9;
      --tone-swap-rgb: 174, 247, 249;
      /* And the rest of the palette in the same hue. page.css ships a teal
         accent and an amber card accent, which are the paper palette's and
         are simply a different colour sitting next to this one. The gold page
         settled this already: on a coloured ground the quiet type is a muted
         version of that ground, not a second hue.
         `accent` reads on the dark side, `accent-alt` on the cyan; the card
         pair is the same two swapped, because a live card flips to whichever
         ground the page is not. Cyan is the lightest of the three primaries,
         so both are pulled down from where the magenta pair sits to land on
         the same contrast against their own ground: 6.9:1 and 6.6:1. */
      --accent: #56a8a4;
      --accent-alt: #185249;
      --card-accent: #185249;
      --card-accent-alt: #7cc9c5;
    }

    /* Above the copy, not behind it. The bars are painted in --tone-swap and
       the layer is differenced against everything under it, so a rectangle
       sliding over the heading inverts the heading along with the ground. It
       sits below .back-btn, the nav chevrons and the cursor ring (all z-index
       200-300, all differenced themselves) so those keep reading against
       whatever the bars have just done to the page. */
    #bar-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 100; pointer-events: none; mix-blend-mode: difference;
    }
    /* The bars ARE the transition. page.css cross-fades the ground over 50ms
       and the copy over 100ms, which everywhere else is the softness of the
       flip -- here it is the old page fading back in on the very frame the
       bars are dropped, because the bars had already been showing the new one
       for a beat. Instant, so the hand-off is exact. */
    #stage-container, html, body { transition: none !important; }
  </style>

  <script>
    (function () {
      // Long rectangles, sliding in from the sides toward the cursor and
      // packing around it. A few of them follow the pointer; holding brings
      // more and more until they have tiled the whole page, and at that point
      // the page has already turned over — because every one of these bars is
      // an inversion, not a shape.
      //
      // That is the whole trick. The canvas sits ABOVE the copy in
      // `mix-blend-mode: difference` and the bars are painted in --tone-swap,
      // and difference against white is `255 - backdrop`. The two page tones
      // are exact complements (11+244, 14+241, 19+236), so a bar crossing the
      // ground lands on the other tone to the byte, and a bar crossing a line
      // of type flips the type with it. Nothing is recoloured and nothing is
      // drawn twice: the heading, the cards, the thumbnails all invert simply
      // by being underneath.
      //
      // So when the pack is complete the page already reads as the other mode
      // everywhere, and window.toggleInvert() only has to make that official.
      // Dropping the bars on the same frame changes nothing on screen.

      const body = document.body;
      const canvas = document.createElement('canvas');
      canvas.id = 'bar-canvas';
      body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      // No 2d context is the one case where this page cannot own the gesture.
      // Leaving HOLD_STATE.owned false hands it to the standby in
      // assets/scroll-nav.js, which is the same hold with no picture behind it.
      if (!ctx) return;

      window.HOLD_STATE = window.HOLD_STATE || { charge: 0, limit: 1500 };
      window.HOLD_STATE.owned = true;

      // Not a colour anyone sees: --tone-swap, the sum of this page's two
      // tones, and the only operand that maps either one onto the other. Read
      // from the stylesheet rather than written here twice -- the pair is a
      // per-page decision now, and a hardcoded #ffffff would paint the bars
      // orange the moment the section stopped being paper-on-black.
      const SWAP = 'rgb(' + getComputedStyle(document.documentElement)
        .getPropertyValue('--tone-swap-rgb').trim() + ')';
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // --- the tiling ---
      // Rows of varying height, each cut into one, two or three long cells, so
      // the finished pack reads as a set of rectangles rather than as a grid.
      //
      // All of it is laid out on the turn — the bars run at 45° — so the tiling
      // is built in its own rotated frame and the whole thing is drawn through
      // one rotate(). Turning each rectangle about its own centre instead would
      // tear the tessellation open, and the gaps that left would be
      // un-inverted ground still showing at the end of the hold, which is the
      // one thing this pack may not do.
      const ROT = Math.PI / 4;
      const COS = Math.cos(ROT), SIN = Math.sin(ROT);
      let bars = [], W = 0, H = 0, unit = 0, dpr = 1, half = 0;

      // Box against box on four axes — exact, for two convex rectangles.
      const AXES = [[1, 0], [0, 1], [COS, SIN], [-SIN, COS]];
      function span(pts, ax, ay) {
        let lo = Infinity, hi = -Infinity;
        for (let i = 0; i < pts.length; i += 2) {
          const v = pts[i] * ax + pts[i + 1] * ay;
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
        return [lo, hi];
      }
      // The tiled square has to overhang the screen on every side to still
      // cover its corners once turned, so a good third of it never shows. Those
      // bars have to exist — they are what the corners are made of — but they
      // must not count toward how far the pack has to reach, or the screen is
      // full long before the charge is.
      function onScreen(b) {
        const cx = W / 2, cy = H / 2, pts = [];
        const xs = [b.x, b.x + b.w], ys = [b.y, b.y + b.h];
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 2; j++) {
            pts.push(cx + xs[i] * COS - ys[j] * SIN, cy + xs[i] * SIN + ys[j] * COS);
          }
        }
        const vp = [0, 0, W, 0, W, H, 0, H];
        for (let a = 0; a < AXES.length; a++) {
          const s = span(pts, AXES[a][0], AXES[a][1]);
          const v = span(vp, AXES[a][0], AXES[a][1]);
          if (s[1] < v[0] || v[1] < s[0]) return false;
        }
        return true;
      }

      function buildBars() {
        W = window.innerWidth; H = window.innerHeight;
        unit = Math.min(W, H);
        // Far enough out in the rotated frame to hold every corner of the
        // viewport: the furthest any of them lands is (W + H) / 2, over root 2.
        half = (W + H) / (2 * Math.SQRT2) + 6;
        const wide = half * 2;
        bars = [];
        let y = -half;
        while (y < half - 0.5) {
          let h = unit * (0.045 + Math.random() * 0.045);
          // Rather than leave a sliver, the last row swallows the remainder.
          if (half - (y + h) < unit * 0.04) h = half - y;
          // Cuts are evenly spaced and then jittered, which is what keeps every
          // cell long: three cells vary between roughly a quarter and two
          // fifths of the row, never a stub. Mostly two or three to a row —
          // enough full-length ones and the pack reads as a stack of bands
          // rather than as rectangles arriving from either side.
          const r = Math.random();
          const n = r < 0.16 ? 1 : (r < 0.60 ? 2 : 3);
          const edge = [0];
          for (let i = 1; i < n; i++) edge.push(i / n + (Math.random() - 0.5) * 0.12);
          edge.push(1);
          for (let i = 0; i < n; i++) {
            const x0 = -half + edge[i] * wide, x1 = -half + edge[i + 1] * wide;
            const b = { x: x0, y: y, w: x1 - x0, h: h, p: 0, left: false, rank: 0, vis: false };
            b.vis = onScreen(b);
            bars.push(b);
          }
          y += h;
        }
      }

      // --- the cards, which the bars leave alone ---
      // Punched straight out of the inversion layer rather than protected in
      // CSS: this canvas is what does the inverting, so a hole in it is a piece
      // of page the bars cannot reach.
      //
      // The whole card comes out, not just the picture in it. A project card is
      // one object — plate, photo, year, title, tags, description — and a bar
      // slicing through the middle of it, flipping half a title and a corner of
      // a photograph, reads as damage rather than as an effect. It is left to
      // turn over with the page, once, when the theme does.
      //
      // The heading and the ground still invert under every bar. That is the
      // whole point of the layer being up here; it is only the cards that are
      // held out of it.
      //
      // The stacked layers sit at opacity 0 until their card is live and fade
      // in and out on a transition, and a hole cut for something that is not
      // being painted is just an un-inverted rectangle. Their painted opacity
      // is the only thing that actually answers that, so it is what gets asked;
      // a class test would open the hole a fifth of a second before the layer
      // it is meant to be protecting arrives.
      let media = [];
      function findMedia() {
        media = [].slice.call(document.querySelectorAll(
          '#main-wrapper .project-item, #main-wrapper .behance-frame'));
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio, 2);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildBars();
        findMedia();
      }
      resize();

      // --- input ---
      // The same numbers as every other page: 1400 up, 3600 down, 1500 to
      // fire, all per second so the hold is the same length on a 120Hz screen.
      const CHARGE_LIMIT = 1500;
      const CHARGE_RATE = 1400;
      const RELEASE_RATE = 3600;
      // The beat at the end, where the stragglers land and the seams between
      // the bars close up. Until they do the pack is not quite the whole page.
      const CLOSE_SECS = reduceMotion ? 0.2 : 0.38;
      // The hairline of un-inverted ground left around each bar. Without it a
      // finished pack is one flat inverted rectangle and the rectangles stop
      // being visible at exactly the moment there are most of them.
      const GAP = 3;

      let pointerX = window.innerWidth / 2, pointerY = window.innerHeight / 2;
      let isHolding = false, charge = 0, closing = 0;
      let last = performance.now();

      window.addEventListener('pointermove', (e) => {
        pointerX = e.clientX; pointerY = e.clientY;
      }, { passive: true });

      const down = (e) => {
        // The back link and the mobile chevrons are targets, not ground. Cards
        // are held over freely: scroll-nav.js cancels their click once the
        // charge has passed ~200, which is what makes a hold over a card a
        // hold and not a mis-tap.
        const el = e.target && e.target.closest ? e.target : null;
        if (el && (el.closest('.back-btn') || el.closest('.mobile-nav-zone') || el.closest('#gmm-float'))) return;
        pointerX = e.clientX; pointerY = e.clientY;
        isHolding = true;
      };
      window.addEventListener('pointerdown', down);
      ['pointerup', 'pointercancel', 'blur'].forEach(
        (evt) => window.addEventListener(evt, () => { isHolding = false; }));

      const clamp01 = (t) => Math.min(1, Math.max(0, t));
      const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);

      function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        // --- charge, and the close ---
        if (closing > 0) {
          closing = Math.max(0, closing - dt);
          if (closing === 0) {
            // The pack covers every pixel, so the page already reads as the
            // other mode. Adopting it changes nothing, and the bars can go.
            window.toggleInvert();
            for (let i = 0; i < bars.length; i++) bars[i].p = 0;
          }
        } else {
          // Space is held exactly as the pointer is — assets/keys.js raises
          // KEY_HOLD while the key is down, so the gesture keeps one owner.
          const holding = isHolding || (window.KEY_HOLD && window.KEY_HOLD.held);
          charge = holding
            ? Math.min(CHARGE_LIMIT, charge + dt * CHARGE_RATE)
            : Math.max(0, charge - dt * RELEASE_RATE);
          if (charge >= CHARGE_LIMIT) {
            closing = CLOSE_SECS;
            charge = 0;
            if (window.noteInvert) window.noteInvert();
          }
        }
        // The ring drawn on the cursor (assets/cursor.js) is the only reader,
        // and it wants a number it can normalise without knowing this page
        // counts rectangles. Set outside the branch, so the close reports zero.
        window.HOLD_STATE.charge = charge;

        const shutting = closing > 0;
        // How far out the pack has reached. Distance is measured with the
        // horizontal axis discounted, because the bars are long: a row fills
        // sideways much faster than the pack climbs into the next row, which is
        // what makes it read as rectangles arriving rather than a circle.
        //
        // The far end of the scale is the furthest bar there actually is from
        // where the pointer actually is, measured fresh each frame — not the
        // worst case of a pointer in a corner. Against the worst case, a
        // pointer anywhere near the middle had the whole page packed at half
        // charge and then stood still for the rest of the hold.
        // The pointer, read in the tiling's own turned frame, so a bar's rank
        // is measured along the bars rather than across the screen.
        const ox = pointerX - W / 2, oy = pointerY - H / 2;
        const px = ox * COS + oy * SIN;
        const py = -ox * SIN + oy * COS;

        let reach = 1;
        for (let i = 0; i < bars.length; i++) {
          const b = bars[i];
          const r = Math.abs(b.y + b.h * 0.5 - py) +
                    Math.abs(b.x + b.w * 0.5 - px) * 0.45;
          b.rank = r;
          if (b.vis && r > reach) reach = r;
        }
        reach += 1;
        const restReach = Math.min(unit * 0.17, reach);
        const c = shutting ? 1 : charge / CHARGE_LIMIT;
        const thr = shutting ? reach : restReach + (reach - restReach) * Math.pow(c, 0.85);

        // The seams hold until the very end and then close, so the last thing
        // the pack does before the page turns is tighten.
        const gap = reduceMotion ? 0 : GAP * (shutting ? closing / CLOSE_SECS : 1);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = SWAP;

        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(ROT);
        for (let i = 0; i < bars.length; i++) {
          const b = bars[i];
          // Whichever side of the cursor the slot is on is the side the bar
          // comes in from, so every one of them is travelling toward the
          // pointer and the two halves of the pack close on it. Fixed while a
          // bar is out of play, so one that is already on its way does not
          // turn round mid-slide when the pointer crosses it.
          if (b.p < 0.01) b.left = b.x + b.w * 0.5 < px;

          const target = b.rank < thr ? 1 : 0;
          // Eased while the pack is following the pointer; driven the last of
          // the way home while it is shutting, because "nearly there" is a
          // sliver of old ground along one edge of the screen.
          b.p = shutting
            ? Math.min(1, b.p + dt * 5)
            : b.p + (target - b.p) * (1 - Math.exp(-dt * 9));

          if (b.p < 0.002) continue;
          const from = b.left ? -half - b.w - 24 : half + 24;
          const x = from + (b.x - from) * easeOut(b.p);
          // Overlaps while a bar is still travelling are free: the bars are
          // composited into this canvas first and the canvas is differenced
          // once, so two of them crossing invert the page once, not twice.
          ctx.fillRect(x + gap, b.y + gap, b.w - gap * 2, b.h - gap * 2);
        }
        ctx.restore();

        // And the media comes back out of the layer. destination-out rather
        // than clearRect so the corners can be rounded the way the thumbnails
        // are; a square hole around a rounded photo leaves four un-inverted
        // notches.
        ctx.globalCompositeOperation = 'destination-out';
        for (let i = 0; i < media.length; i++) {
          const el = media[i];
          const r = el.getBoundingClientRect();
          if (r.width < 1 || r.height < 1) continue;
          if (r.right < 0 || r.left > W || r.bottom < 0 || r.top > H) continue;
          if (+getComputedStyle(el).opacity < 0.02) continue;
          // A pixel out and a corner radius under the real one, so the hole
          // overshoots the card very slightly rather than leaving four notches
          // of un-punched arc at the corners — which is exactly what a radius
          // matched to the card's own 8px does.
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(r.left - 1, r.top - 1, r.width + 2, r.height + 2, 5);
          else ctx.rect(r.left - 1, r.top - 1, r.width + 2, r.height + 2);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
      requestAnimationFrame(frame);

      let resizeTimer = 0;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 200);
      });
    })();
  </script>

</body>
